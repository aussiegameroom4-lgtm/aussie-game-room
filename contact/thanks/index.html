<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks! | Aussie Game Room</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070a14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a14; --ink:#f6f1e4; --muted:#a9afc4; --gold:#ffd24a; --gold-deep:#e8a33d; --teal:#2fd3c3; --coral:#ff5a5f;}
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font-family:'Nunito',sans-serif; text-align:center;
  background-image:radial-gradient(600px 420px at 20% 10%, rgba(47,211,195,0.14), transparent 70%), radial-gradient(700px 500px at 80% 90%, rgba(255,210,74,0.12), transparent 70%);}
.box{max-width:520px;}
.big{font-size:56px; line-height:1;}
h1{font-family:'Lilita One',cursive; font-weight:400; font-size:clamp(34px,7vw,48px); margin:14px 0 10px;}
p{color:var(--muted); font-size:17px; line-height:1.55; margin:0 0 26px;}
a.btn{display:inline-block; font-weight:900; font-size:16px; color:#1a1206; text-decoration:none; padding:14px 26px; border-radius:30px; background:linear-gradient(140deg,var(--gold),var(--gold-deep)); box-shadow:0 6px 18px rgba(255,210,74,0.25);}
</style>
</head>
<body>
  <div class="box">
    <div class="big" aria-hidden="true">🎉</div>
    <h1>Thanks for the message!</h1>
    <p>It's on its way to me. If you left your email, I'll get back to you soon.</p>
    <a class="btn" href="/">Back to the games</a>
  </div>
</body>
</html>
