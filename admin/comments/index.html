<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox | Aussie Game Room</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070a14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a14; --bg2:#0d1222; --ink:#f6f1e4; --muted:#a9afc4; --line:rgba(255,255,255,0.1); --gold:#ffd24a; --gold-deep:#e8a33d; --teal:#2fd3c3; --coral:#ff5a5f; --violet:#b48cff;}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Nunito',sans-serif;}
main{max-width:780px; margin:0 auto; padding:24px 16px 60px;}
h1{font-family:'Lilita One',cursive; font-weight:400; font-size:34px; margin:0;}
.top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.sub{color:var(--muted); margin:0 0 14px; font-size:15px;}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 6px;}
.tab{font:inherit; font-weight:800; font-size:14px; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;}
.tab.on{background:var(--ink); color:#111; border-color:var(--ink);}
.tab .n{display:inline-block; min-width:20px; margin-left:4px; padding:0 6px; border-radius:10px; background:rgba(255,90,95,0.9); color:#fff; font-size:12px;}
.card{background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin:10px 0;}
.card.unread{border-color:rgba(255,210,74,0.5); background:rgba(255,210,74,0.05);}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.tag{font-size:12px; font-weight:800; letter-spacing:.4px; padding:3px 9px; border-radius:20px; background:rgba(255,255,255,0.08); color:var(--muted);}
.tag.Bug{background:rgba(255,90,95,0.18); color:#ff9a9d;}
.tag.Idea{background:rgba(180,140,255,0.18); color:var(--violet);}
.tag.Feedback{background:rgba(47,211,195,0.16); color:var(--teal);}
.tag.Question{background:rgba(255,210,74,0.16); color:var(--gold);}
.tag.share{background:rgba(255,210,74,0.16); color:var(--gold);}
.tag.live{background:rgba(47,211,195,0.22); color:var(--teal);}
.card p{margin:0 0 10px; font-size:16px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere;}
.meta{color:var(--muted); font-size:13px; font-weight:700; margin-bottom:12px; overflow-wrap:anywhere;}
.meta b{color:var(--ink);}
.meta a{color:var(--teal);}
.btns{display:flex; flex-wrap:wrap; gap:8px;}
button{font:inherit; font-weight:800; font-size:14px; border-radius:24px; padding:9px 16px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink);}
button.go{background:linear-gradient(140deg,var(--gold),var(--gold-deep)); color:#1a1206; border:0;}
button.del{color:var(--coral); border-color:rgba(255,90,95,0.4);}
button:disabled{opacity:.5; cursor:wait;}
.empty{color:var(--muted); border:1px dashed var(--line); border-radius:16px; padding:18px; text-align:center;}
.login{display:grid; gap:10px; max-width:420px; margin-top:14px;}
input{font:inherit; font-size:16px; color:var(--ink); background:var(--bg2); border:1px solid rgba(255,255,255,0.16); border-radius:12px; padding:12px 14px;}
.msg{min-height:22px; color:var(--muted); font-weight:700;}
.msg.err{color:var(--coral);}
a{color:var(--teal);}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Inbox</h1>
    <button id="logout" hidden>Log out</button>
  </div>
  <p class="sub">Every message from your Contact &amp; feedback page. If the player ticked "You can show my comment", tap <b>Show on website</b> and it appears on the homepage within about 5 minutes.</p>
  <div class="msg" id="msg" role="status"></div>

  <form class="login" id="login" hidden>
    <label for="key">Your admin key</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <button class="go" type="submit">Open</button>
  </form>

  <div id="lists" hidden>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="new">New<span class="n" id="nNew"></span></button>
      <button class="tab" data-tab="all">All messages</button>
      <button class="tab" data-tab="live">On the website</button>
    </div>
    <div id="list"></div>
    <p class="sub" style="margin-top:30px"><a href="/">Back to the site</a></p>
  </div>
</main>
<script>
(function(){
  var KEY_NAME = 'agr-admin-key', key = '', tab = 'new', data = { inbox: [], shown: [] };
  try { key = localStorage.getItem(KEY_NAME) || ''; } catch(e){}
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(t){ var d=document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; };
  var say = function(t, err){ $('msg').textContent = t || ''; $('msg').classList.toggle('err', !!err); };
  var when = function(ms){ try { return new Date(ms).toLocaleString('en-AU', {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}); } catch(e){ return ''; } };
  var LABEL = { Feedback:'Feedback', Bug:'Bug', Idea:'Idea', Question:'Question', Other:'Other' };

  function card(m){
    var tags = '<span class="tag ' + esc(m.type) + '">' + esc(LABEL[m.type] || m.type) + '</span>' +
      (m.game ? '<span class="tag">' + esc(m.game) + '</span>' : '') +
      (m.shown ? '<span class="tag live">On the website</span>' : (m.share ? '<span class="tag share">OK to show</span>' : ''));
    var from = (m.name ? '<b>' + esc(m.name) + '</b>' : '<b>No name</b>') +
      (m.email ? ' · <a href="mailto:' + esc(m.email) + '?subject=' + encodeURIComponent('Re: your message to Aussie Game Room') + '">' + esc(m.email) + '</a>' : ' · no email') +
      ' · ' + when(m.at) + (m.share && m.displayName ? ' · shows as "' + esc(m.displayName) + '"' : (m.share ? ' · shows as "A player"' : ''));
    var b = '';
    if (m.share && !m.shown) b += '<button class="go" data-act="approve" data-id="' + esc(m.id) + '">Show on website</button>';
    if (m.shown) b += '<button data-act="hide" data-id="' + esc(m.id) + '">Take off website</button>';
    if (m.email) b += '<button data-reply="' + esc(m.email) + '">Reply by email</button>';
    b += '<button data-act="read" data-id="' + esc(m.id) + '">' + (m.read ? 'Mark as new' : 'Mark as read') + '</button>';
    b += '<button class="del" data-act="delete" data-id="' + esc(m.id) + '">Delete</button>';
    return '<div class="card' + (m.read ? '' : ' unread') + '"><div class="tags">' + tags + '</div><p>' + esc(m.text) + '</p><div class="meta">' + from + '</div><div class="btns">' + b + '</div></div>';
  }
  function draw(){
    var inbox = data.inbox || [];
    var nNew = inbox.filter(function(m){ return !m.read; }).length;
    $('nNew').textContent = nNew; $('nNew').hidden = !nNew;
    var list = tab === 'new' ? inbox.filter(function(m){ return !m.read; })
             : tab === 'live' ? inbox.filter(function(m){ return m.shown; })
             : inbox;
    var empty = { new: 'No new messages. 👍', all: 'No messages yet.', live: 'No comments on the website yet.' }[tab];
    $('list').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">' + empty + '</div>';
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.tab === tab); });
    $('lists').hidden = false; $('login').hidden = true; $('logout').hidden = false;
  }
  function call(method, query){
    return fetch('/api/comments?' + query, { method: method, headers: { 'X-Admin-Key': key } }).then(function(r){
      if (r.status === 401) throw new Error('key');
      if (!r.ok) throw new Error('fail');
      return r.json();
    });
  }
  function showLogin(text){
    $('lists').hidden = true; $('logout').hidden = true; $('login').hidden = false; say(text || '', !!text); $('key').focus();
  }
  function load(){
    if (!key) return showLogin();
    say('Loading…');
    call('GET', 'admin=1').then(function(d){ data = d; say(''); draw(); }).catch(function(e){
      if (e.message === 'key') { key = ''; try { localStorage.removeItem(KEY_NAME); } catch(x){} showLogin('That key didn\'t work. Try again.'); }
      else say('Couldn\'t load your messages. Try again in a moment.', true);
    });
  }
  $('login').addEventListener('submit', function(e){
    e.preventDefault(); key = $('key').value.trim();
    try { localStorage.setItem(KEY_NAME, key); } catch(x){}
    load();
  });
  $('logout').addEventListener('click', function(){ key = ''; try { localStorage.removeItem(KEY_NAME); } catch(x){} showLogin(); });
  document.addEventListener('click', function(e){
    var t = e.target.closest('.tab'); if (t) { tab = t.dataset.tab; draw(); return; }
    var r = e.target.closest('button[data-reply]');
    if (r) { location.href = 'mailto:' + r.dataset.reply + '?subject=' + encodeURIComponent('Re: your message to Aussie Game Room'); return; }
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'delete' && b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again to delete'; return; }
    b.disabled = true; say('Saving…');
    call('POST', 'action=' + act + '&id=' + encodeURIComponent(b.dataset.id)).then(function(d){
      data = d; draw();
      say(act === 'approve' ? 'Done. It will show on the homepage within about 5 minutes.' : 'Done.');
    }).catch(function(){ b.disabled = false; say('Couldn\'t save that. Try again.', true); });
  });
  load();
})();
</script>
</body>
</html>
