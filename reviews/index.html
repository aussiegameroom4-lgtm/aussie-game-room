<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Reviews | Aussie Game Room</title>
<meta name="description" content="What players say about Aussie Game Room's free word and number games: Word Scramble, Word Chain Express and Stack Attack.">
<link rel="canonical" href="https://aussiegameroom.com/reviews/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Aussie Game Room">
<meta property="og:title" content="Player Reviews | Aussie Game Room">
<meta property="og:description" content="What players say about Aussie Game Room's free games.">
<meta property="og:url" content="https://aussiegameroom.com/reviews/">
<meta name="theme-color" content="#070a14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a14; --bg2:#0d1222; --ink:#f6f1e4; --muted:#a9afc4; --line:rgba(255,255,255,0.09);
  --gold:#ffd24a; --gold-deep:#e8a33d; --teal:#2fd3c3; --coral:#ff5a5f;}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Nunito',sans-serif; overflow-x:hidden;}
.glow{position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(600px 420px at 12% 8%, rgba(47,211,195,0.14), transparent 70%),
    radial-gradient(700px 500px at 88% 18%, rgba(255,210,74,0.12), transparent 70%),
    radial-gradient(800px 600px at 50% 105%, rgba(255,90,95,0.10), transparent 70%);}
.page{position:relative; z-index:1;}
.topbar{max-width:1120px; margin:0 auto; padding:20px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
.logo{display:flex; align-items:center; gap:10px; font-family:'Lilita One',cursive; font-size:20px; letter-spacing:0.5px; color:var(--ink); text-decoration:none;}
.logo-mark{width:38px; height:38px; border-radius:10px; display:block; object-fit:cover; border:1px solid rgba(255,210,74,0.55); box-shadow:0 0 16px rgba(255,210,74,0.35);}
.nav-pill{font-weight:800; font-size:13px; color:var(--ink); text-decoration:none; padding:9px 16px; border-radius:30px; border:1px solid var(--line); background:rgba(255,255,255,0.04);}
.nav-pill:hover{background:rgba(255,255,255,0.09); border-color:rgba(255,210,74,0.4);}
main{max-width:1072px; margin:0 auto; padding:24px 24px 20px;}
h1{font-family:'Lilita One',cursive; font-weight:400; font-size:clamp(34px,7vw,52px); line-height:1.05; margin:0 0 8px; letter-spacing:0.5px;}
h1 span{background:linear-gradient(90deg,var(--gold),var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.lead{color:var(--muted); font-size:17px; line-height:1.55; margin:0 0 22px;}
.filters{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px;}
.filters button{font:inherit; font-weight:800; font-size:13px; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;}
.filters button.on{background:var(--ink); color:#111; border-color:var(--ink);}
.list{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px;}
.quote{margin:0; padding:20px 22px; border-radius:18px; border:1px solid var(--line); background:rgba(255,255,255,0.03);}
.quote p{margin:0 0 12px; font-size:15px; line-height:1.55; overflow-wrap:anywhere;}
.quote p::before{content:"\201C";} .quote p::after{content:"\201D";}
.quote .by{font-size:13px; font-weight:800; color:var(--muted);}
.quote .by b{color:var(--gold); font-weight:800;}
.empty{color:var(--muted); border:1px dashed var(--line); border-radius:16px; padding:22px; text-align:center;}
.cta{margin:36px auto 0; text-align:center;}
.cta a{display:inline-block; font-weight:900; font-size:16px; color:#1a1206; text-decoration:none; padding:14px 26px; border-radius:30px;
  background:linear-gradient(140deg,var(--gold),var(--gold-deep)); box-shadow:0 6px 18px rgba(255,210,74,0.25);}
footer{margin-top:70px; padding:34px 24px 44px; text-align:center; border-top:1px solid var(--line); color:var(--muted); font-weight:700; font-size:13px;}
footer a{color:var(--muted);}
footer .heart{color:var(--coral);}
@media (max-width:560px){ .topbar{padding:14px 16px;} main{padding:16px;} .list{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="glow"></div>
<div class="page">
  <div class="topbar">
    <a class="logo" href="/"><img class="logo-mark" src="/apple-touch-icon.png" alt="" width="38" height="38">Aussie Game Room</a>
    <a class="nav-pill" href="/#games">All games</a>
  </div>
  <main>
    <h1>Player <span>reviews</span></h1>
    <p class="lead" id="lead">What players are saying about the games.</p>
    <div class="filters" id="filters" hidden></div>
    <div class="list" id="list"><div class="empty">Loading reviews…</div></div>
    <div class="cta"><a href="/contact/">Leave your own review</a></div>
  </main>
  <footer>Made in Australia <span class="heart">♥</span> Aussie Game Room · <a href="/">Back to the games</a></footer>
</div>
<script>
(function(){
  var all = [], game = '';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(t){ var d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; };
  function draw(){
    var list = game ? all.filter(function(c){ return c.game === game; }) : all;
    $('list').innerHTML = list.length ? list.map(function(c){
      return '<blockquote class="quote"><p>' + esc(c.text) + '</p><div class="by"><b>' + esc(c.name || 'A player') + '</b>' +
        (c.game ? ' · ' + esc(c.game) : '') + '</div></blockquote>';
    }).join('') : '<div class="empty">No reviews here yet. Be the first!</div>';
    document.querySelectorAll('#filters button').forEach(function(b){ b.classList.toggle('on', b.dataset.g === game); });
  }
  fetch('/api/comments').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    all = d && d.comments ? d.comments : [];
    $('lead').textContent = all.length ? (all.length === 1 ? '1 review from a player.' : all.length + ' reviews from players.') + ' Every one is real and shared with permission.' : 'No reviews yet. Be the first!';
    var games = [];
    all.forEach(function(c){ if (c.game && games.indexOf(c.game) < 0) games.push(c.game); });
    if (games.length) {
      $('filters').innerHTML = '<button data-g="">All games</button>' + games.map(function(g){ return '<button data-g="' + esc(g) + '">' + esc(g) + '</button>'; }).join('');
      $('filters').hidden = false;
      $('filters').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) { game = b.dataset.g; draw(); } });
    }
    draw();
  }).catch(function(){ $('list').innerHTML = '<div class="empty">Couldn\'t load reviews. Try again in a moment.</div>'; });
})();
</script>
</body>
</html>
